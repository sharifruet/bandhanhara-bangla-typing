<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#3730a3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="680" height="200" rx="24" fill="url(#bg)"/>
  <ellipse cx="130" cy="100" rx="180" ry="110" fill="url(#glow)"/>

  <!-- ── BIRD: same minimal swift, scaled down, left side ── -->
  <!-- Body -->
  <path d="M 38 102
           C 60 88 90 90 118 95
           C 107 102 90 105 76 107
           C 62 108 46 107 38 102 Z"
        fill="white"/>

  <!-- Primary wing -->
  <path d="M 73 93
           C 66 80 55 68 42 62
           C 47 70 58 82 68 93 Z"
        fill="white"/>

  <!-- Wing secondary surface -->
  <path d="M 72 97
           C 84 103 100 107 118 104
           C 105 101 88 98 75 96 Z"
        fill="rgba(255,255,255,0.35)"/>

  <!-- Forked tail -->
  <path d="M 41 102 L 26 112" stroke="white" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 41 102 L 25 100" stroke="white" stroke-width="4"   stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <ellipse cx="121" cy="94" rx="8.5" ry="7" fill="white" transform="rotate(-8 121 94)"/>

  <!-- Eye -->
  <circle cx="123.5" cy="92" r="2.2" fill="#0f172a"/>
  <circle cx="124.2" cy="91.4" r="0.8" fill="white"/>

  <!-- Beak -->
  <path d="M 127 94 L 138 91 L 127 97 Z" fill="#93c5fd"/>

  <!-- Connecting dots (text trail) -->
  <circle cx="130" cy="117" r="2"   fill="rgba(147,197,253,0.6)"/>
  <circle cx="132" cy="125" r="1.5" fill="rgba(147,197,253,0.38)"/>

  <!-- Small ক floating below bird beak -->
  <text x="122" y="158"
        font-family="'Noto Sans Bengali', 'Noto Serif Bengali', serif"
        font-size="38" font-weight="500"
        fill="white" opacity="0.88">ক</text>

  <!-- Divider line -->
  <line x1="185" y1="40" x2="185" y2="160" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- ── TEXT: right side ── -->

  <!-- Bangla name: বাঁধনহারা বাংলা -->
  <text x="208" y="102"
        font-family="'Noto Sans Bengali', 'Noto Serif Bengali', serif"
        font-size="52" font-weight="500"
        fill="white" letter-spacing="-0.5">বাঁধনহারা বাংলা</text>

  <!-- English subtitle -->
  <text x="210" y="135"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="400"
        fill="rgba(147,197,253,0.8)" letter-spacing="0.5">Bandhanhara Bangla</text>

  <!-- Tagline -->
  <text x="210" y="158"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="300"
        fill="rgba(255,255,255,0.38)" letter-spacing="0.3">frequency-optimized Bangla keyboard</text>
</svg>
