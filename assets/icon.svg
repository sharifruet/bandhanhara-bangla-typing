<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#3730a3" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft indigo center glow -->
  <ellipse cx="256" cy="210" rx="210" ry="170" fill="url(#glow)"/>

  <!-- ── BIRD: minimal swift, side view, facing right ── -->

  <!-- Body: elongated teardrop, tail-left to head-right -->
  <path d="M 118 218
           C 162 190 225 193 282 200
           C 255 214 210 220 178 224
           C 148 226 128 224 118 218 Z"
        fill="white"/>

  <!-- Primary wing: large swept-back shape above body -->
  <path d="M 178 200
           C 162 174 136 148 106 134
           C 118 150 143 175 168 200 Z"
        fill="white"/>

  <!-- Wing secondary surface (under-wing, lower opacity) -->
  <path d="M 175 205
           C 205 218 245 224 282 219
           C 252 214 210 208 182 204 Z"
        fill="rgba(255,255,255,0.35)"/>

  <!-- Forked tail -->
  <path d="M 122 217 L 88 236" stroke="white" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 122 217 L 86 216" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Head (small ellipse, slight tilt) -->
  <ellipse cx="290" cy="198" rx="17" ry="14" fill="white" transform="rotate(-8 290 198)"/>

  <!-- Eye -->
  <circle cx="296" cy="194" r="4.5" fill="#0f172a"/>
  <circle cx="297.5" cy="193" r="1.5" fill="white"/>

  <!-- Beak (light blue accent) -->
  <path d="M 302 197 L 325 192 L 302 202 Z" fill="#93c5fd"/>

  <!-- ── Bangla text trail: the bird is "typing" characters ── -->

  <!-- Connecting dots showing text flow from bird downward -->
  <circle cx="308" cy="244" r="4"   fill="rgba(147,197,253,0.65)"/>
  <circle cx="315" cy="260" r="3"   fill="rgba(147,197,253,0.45)"/>
  <circle cx="321" cy="276" r="2.5" fill="rgba(147,197,253,0.28)"/>

  <!-- Primary Bangla character: ক (ka) — largest, most opaque -->
  <text x="268" y="380"
        font-family="'Noto Sans Bengali', 'Noto Serif Bengali', serif"
        font-size="105" font-weight="500"
        fill="white" opacity="0.93">ক</text>

  <!-- Secondary character: া (aa-diacritic) — fading out -->
  <text x="378" y="352"
        font-family="'Noto Sans Bengali', 'Noto Serif Bengali', serif"
        font-size="72" font-weight="400"
        fill="white" opacity="0.48">া</text>

  <!-- ── Subtle keyboard-key hint at bottom ── -->
  <rect x="135" y="450" width="36" height="26" rx="6" fill="rgba(255,255,255,0.07)"/>
  <rect x="181" y="450" width="36" height="26" rx="6" fill="rgba(255,255,255,0.07)"/>
  <rect x="227" y="450" width="36" height="26" rx="6" fill="rgba(255,255,255,0.07)"/>
  <rect x="273" y="450" width="36" height="26" rx="6" fill="rgba(255,255,255,0.07)"/>
  <rect x="319" y="450" width="36" height="26" rx="6" fill="rgba(255,255,255,0.07)"/>
  <rect x="365" y="450" width="36" height="26" rx="6" fill="rgba(255,255,255,0.07)"/>
</svg>
